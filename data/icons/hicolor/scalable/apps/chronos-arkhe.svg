<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Base Squircle Dark Slate (Adwaita Dark) -->
    <linearGradient id="bgPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c303a"/>
      <stop offset="100%" stop-color="#181a20"/>
    </linearGradient>

    <!-- Bevel Superior -->
    <linearGradient id="bevelLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Fundo Central: Laranja / Âmbar Quente (Arkhe / Coleções) -->
    <radialGradient id="arkheCore" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>

    <!-- Lâminas do Obturador (8 lamelas) -->
    <linearGradient id="bladeLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a4f5c"/>
      <stop offset="100%" stop-color="#2d313a"/>
    </linearGradient>
    <linearGradient id="bladeDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b3f4a"/>
      <stop offset="100%" stop-color="#202329"/>
    </linearGradient>

    <filter id="shadowSquircle" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="shadowGlyph" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.38"/>
    </filter>

    <filter id="innerDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <g id="shutterBlades">
      <path d="M 256 36 A 220 220 0 0 1 411.6 100.4 L 336 256 L 256 142 Z" fill="url(#bladeLight)" stroke="#17191e" stroke-width="1.8"/>
      <path d="M 411.6 100.4 A 220 220 0 0 1 476 256 L 336 256 L 370 176 Z" fill="url(#bladeDark)" stroke="#17191e" stroke-width="1.8"/>
      <path d="M 476 256 A 220 220 0 0 1 411.6 411.6 L 256 336 L 370 336 Z" fill="url(#bladeLight)" stroke="#17191e" stroke-width="1.8"/>
      <path d="M 411.6 411.6 A 220 220 0 0 1 256 476 L 256 336 L 336 370 Z" fill="url(#bladeDark)" stroke="#17191e" stroke-width="1.8"/>
      <path d="M 256 476 A 220 220 0 0 1 100.4 411.6 L 176 256 L 256 370 Z" fill="url(#bladeLight)" stroke="#17191e" stroke-width="1.8"/>
      <path d="M 100.4 411.6 A 220 220 0 0 1 36 256 L 176 256 L 142 336 Z" fill="url(#bladeDark)" stroke="#17191e" stroke-width="1.8"/>
      <path d="M 36 256 A 220 220 0 0 1 100.4 100.4 L 256 176 L 142 176 Z" fill="url(#bladeLight)" stroke="#17191e" stroke-width="1.8"/>
      <path d="M 100.4 100.4 A 220 220 0 0 1 256 36 L 256 176 L 176 142 Z" fill="url(#bladeDark)" stroke="#17191e" stroke-width="1.8"/>
    </g>
  </defs>

  <!-- 1. BASE GNOME SQUIRCLE -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgPlate)" filter="url(#shadowSquircle)"/>
  <rect x="25" y="25" width="462" height="462" rx="107" ry="107" fill="none" stroke="url(#bevelLight)" stroke-width="2"/>

  <!-- 2. BORDO EXTERNO DO CONJUNTO ÓPTICO -->
  <circle cx="256" cy="256" r="222" fill="#14151a"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#2c303a" stroke-width="3"/>

  <!-- 3. OBTURADOR DE 8 LÂMINAS -->
  <use href="#shutterBlades"/>

  <!-- 4. BISEL & SOMBRA INTERNA -->
  <circle cx="256" cy="256" r="114" fill="#0d0e12" filter="url(#innerDepth)"/>
  <circle cx="256" cy="256" r="114" fill="none" stroke="#121318" stroke-width="3"/>

  <!-- 5. NÚCLEO ILUMINADO (Laranja Arkhe) -->
  <circle cx="256" cy="256" r="110" fill="url(#arkheCore)"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#fdba74" stroke-width="1" stroke-opacity="0.4"/>

  <!-- 6. GLIFO: CARTÃO SD + PASTA DE COLEÇÕES (Sem setas) -->
  <g filter="url(#shadowGlyph)">
    <!-- Cartão de Memória SD a emergir da pasta -->
    <g transform="translate(15, -15)">
      <path d="M 245 192 L 285 192 L 298 206 L 298 250 L 232 250 L 232 205 A 13 13 0 0 1 245 192 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <!-- Contactos dourados do cartão -->
      <rect x="240" y="196" width="5" height="12" rx="1.5" fill="#facc15"/>
      <rect x="250" y="196" width="5" height="12" rx="1.5" fill="#facc15"/>
      <rect x="260" y="196" width="5" height="12" rx="1.5" fill="#facc15"/>
      <rect x="270" y="196" width="5" height="12" rx="1.5" fill="#facc15"/>
      <rect x="280" y="196" width="5" height="12" rx="1.5" fill="#facc15"/>
    </g>

    <!-- Pasta de Coleções (Azul Adwaita) -->
    <path d="M 198 215 L 230 215 L 244 227 L 314 227 A 8 8 0 0 1 322 235 L 322 296 A 10 10 0 0 1 312 306 L 198 306 A 10 10 0 0 1 188 296 L 188 225 A 10 10 0 0 1 198 215 Z" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
    <path d="M 188 238 L 322 238 L 322 296 A 10 10 0 0 1 312 306 L 198 306 A 10 10 0 0 1 188 296 Z" fill="#2563eb"/>

    <!-- Miniatura de Fotografia com Ano / Data -->
    <g transform="translate(254, 252)">
      <rect x="0" y="0" width="54" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="0" y="0" width="54" height="14" rx="5" fill="#0284c7"/>
      <text x="27" y="10.5" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">2026</text>
      <!-- Mini montanhas/paisagem -->
      <polygon points="6,36 18,22 28,36" fill="#10b981"/>
      <polygon points="22,36 34,18 48,36" fill="#059669"/>
      <circle cx="42" cy="20" r="3" fill="#f59e0b"/>
    </g>
  </g>
</svg>